name: renovate (reusable)

on:
  workflow_call:
    inputs:
      repo-cache:
        type: string
        default: enabled
        description: enabled | disabled | reset
      log-level:
        type: string
        default: info
        description: debug | info
      auto-approve:
        type: string
        default: "false"
        description: "true | false"
      dry-run:
        type: string
        default: disabled
        description: disabled | full | lookup | extract
      config-file:
        type: string
        default: ""
        description: >-
          Absolute path (inside the caller's checkout) to a global config
          file to use verbatim, skipping auto-resolution.
      shared-ref:
        type: string
        default: ""
        description: >-
          Ref of aucampia/shared to pull the renovate action from. Defaults
          to "main". `job.workflow_sha` (the commit of this reusable
          workflow file itself) would auto-track whatever ref a caller
          pinned its `uses:` to, but actionlint 1.7.12 does not know that
          property yet, and the only workaround (round-tripping through
          fromJSON) is worse than a plain default - override this input to
          test an unmerged branch of `shared`, see `task renovate:gha:run`
          there.
    secrets:
      RENOVATE_TOKEN:
        required: true

jobs:
  renovate:
    name: renovate
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      pull-requests: write # postprocess.sh approves PRs
      actions: read # action.yml's dawidd6/action-download-artifact step
    steps:
      - name: Checkout calling repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Checkout aucampia/shared
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: aucampia/shared
          ref: ${{ inputs.shared-ref || 'main' }}
          path: .github/_gh-aucampia-shared

      - name: Run Renovate
        # Not `$/...`: that resolves against this workflow's own repository at
        # the commit being run, which would pin the action to the same ref as
        # the workflow and drop the shared-ref input. The checkout above exists
        # precisely so callers can point the action at a different ref.
        uses: ./.github/_gh-aucampia-shared/part/renovate/v1/action # zizmor: ignore[self-repository]
        with:
          repo-cache: ${{ inputs.repo-cache }}
          log-level: ${{ inputs.log-level }}
          auto-approve: ${{ inputs.auto-approve }}
          dry-run: ${{ inputs.dry-run }}
          config-file: ${{ inputs.config-file }}
          renovate-token: ${{ secrets.RENOVATE_TOKEN }}
          github-actions-token: ${{ secrets.GITHUB_TOKEN }}
