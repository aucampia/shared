name: renovate (reusable)

on:
  workflow_call:
    inputs:
      repo-cache:
        type: string
        default: enabled
        description: enabled | disabled | reset
      log-level:
        type: string
        default: info
        description: debug | info
      auto-approve:
        type: string
        default: "false"
        description: "true | false"
      dry-run:
        type: string
        default: disabled
        description: disabled | full | lookup | extract
      config-file:
        type: string
        default: ""
        description: >-
          Absolute path (inside the caller's checkout) to a global config
          file to use verbatim, skipping auto-resolution.
      shared-ref:
        type: string
        default: ""
        description: >-
          Ref of aucampia/shared to pull the renovate action from. Defaults
          to "main". `job.workflow_sha` (the commit of this reusable
          workflow file itself) would auto-track whatever ref a caller
          pinned its `uses:` to, but actionlint 1.7.12 does not know that
          property yet, and the only workaround (round-tripping through
          fromJSON) is worse than a plain default - override this input to
          test an unmerged branch of `shared`, see `task renovate:gha:run`
          there.
    secrets:
      RENOVATE_TOKEN:
        required: true

env:
  RENOVATE_CACHE_ARCHIVE: /tmp/renovate-cache.tar.gz
  RENOVATE_REPORT_FILE: /tmp/renovate-report.json
  RENOVATE_CACHE_KEY: renovate-cache

jobs:
  renovate:
    name: renovate
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      pull-requests: write # postprocess.sh approves PRs
      actions: read # dawidd6/action-download-artifact reads prior runs
    steps:
      - name: Checkout calling repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Checkout aucampia/shared
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: aucampia/shared
          ref: ${{ inputs.shared-ref || 'main' }}
          path: .github/_shared

      - uses: dawidd6/action-download-artifact@d63b86af1b34672e53c440b1b83979861906bad7 # v24
        if: inputs.repo-cache != 'disabled'
        continue-on-error: true
        with:
          name: ${{ env.RENOVATE_CACHE_KEY }}
          path: /tmp
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Renovate
        uses: ./.github/_shared/part/renovate/v1
        with:
          repo-cache: ${{ inputs.repo-cache }}
          log-level: ${{ inputs.log-level }}
          auto-approve: ${{ inputs.auto-approve }}
          dry-run: ${{ inputs.dry-run }}
          config-file: ${{ inputs.config-file }}
          cache-archive: ${{ env.RENOVATE_CACHE_ARCHIVE }}
          report-file: ${{ env.RENOVATE_REPORT_FILE }}
          renovate-token: ${{ secrets.RENOVATE_TOKEN }}
          github-actions-token: ${{ secrets.GITHUB_TOKEN }}

      # A dry run does not upload its cache: the artifact is shared with the
      # scheduled run on the default branch, and a branch under test should
      # not be able to poison it.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: inputs.repo-cache != 'disabled' && inputs.dry-run == 'disabled'
        with:
          name: ${{ env.RENOVATE_CACHE_KEY }}
          path: ${{ env.RENOVATE_CACHE_ARCHIVE }}
          retention-days: 1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: renovate-report
          path: ${{ env.RENOVATE_REPORT_FILE }}
          retention-days: 5
