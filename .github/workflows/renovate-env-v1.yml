# This workflow extracts the environment variables needed to run Renovate
# manually. It remains active for {lifetime} seconds so the GitHub Action
# token remains valid, but the task that invokes it (task renovate:env:run)
# kills it as soon as it's done with the tokens.
#
# The workflow_call definition: reusable from any repository via
# `uses: aucampia/shared/.github/workflows/renovate-env-v1.yml@main`, and
# dogfooded locally by this repository's own renovate-env.yml
# (`uses: ./...`) - see part/renovate/v1/templates/renovate-env.yml, the
# thin workflow_dispatch caller consumer repos copy in as their own
# renovate-env.yml.
name: renovate-env (reusable)

on:
  workflow_call:
    inputs:
      lifetime:
        type: number
        default: 120
        description: 'How long should the tokens be valid for'
      gpg_public_key:
        required: true
        type: string
        description: 'The public key to use for GPG encryption'
    secrets:
      RENOVATE_TOKEN:
        required: true

concurrency:
  group: >
    ${{ github.repository }}-
    ${{ github.workflow }}-
  cancel-in-progress: true

jobs:
  renovate-env:
    name: renovate-env
    runs-on: ubuntu-latest
    # Job-level, not workflow-level: this token is only used after this job
    # exports it (locally, outside this run entirely, to approve PRs there),
    # never by this job's own steps - scoping it to the one job that needs
    # it avoids granting it workflow-wide for no reason.
    permissions:
      pull-requests: write # exported RENOVATE_GITHUB_ACTIONS_TOKEN approves PRs locally
    steps:
      - name: Export Renovate Secrets
        run: |
          set -Eeuo pipefail

          printenv GPG_PUBLIC_KEY > /var/tmp/gpg.pub

          {
            echo "RENOVATE_TOKEN=${RENOVATE_TOKEN@Q}"
            echo "RENOVATE_GITHUB_ACTIONS_TOKEN=${RENOVATE_GITHUB_ACTIONS_TOKEN@Q}"
          } | gpg --encrypt --armor --recipient-file /var/tmp/gpg.pub > /var/tmp/renovate-env.asc
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_GITHUB_ACTIONS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_PUBLIC_KEY: ${{ inputs.gpg_public_key }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: renovate-env
          path: /var/tmp/renovate-env.asc
          retention-days: 1
      - run: |
          set -Eeuo pipefail
          sleep "${LIFETIME}"
        env:
          LIFETIME: ${{ inputs.lifetime }}
