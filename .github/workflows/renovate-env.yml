# Dogfoods renovate-env-v1.yml (the workflow_call definition) against this
# repository itself - functionally identical to
# part/renovate/v1/templates/renovate-env.yml, the caller other repos copy
# in as their own renovate-env.yml, except this one always calls the
# *local* renovate-env-v1.yml (`uses: $/...`).
name: renovate-env

on:
  workflow_dispatch:
    inputs:
      lifetime:
        description: 'How long should the tokens be valid for'
        type: number
        default: 120
      gpg_public_key:
        required: true
        description: 'The public key to use for GPG encryption'
        type: string

concurrency:
  group: >
    ${{ github.repository }}-
    ${{ github.workflow }}-
  cancel-in-progress: true

jobs:
  renovate-env:
    uses: $/.github/workflows/renovate-env-v1.yml
    permissions:
      pull-requests: write # exported RENOVATE_GITHUB_ACTIONS_TOKEN approves PRs locally
    with:
      lifetime: ${{ inputs.lifetime }}
      gpg_public_key: ${{ inputs.gpg_public_key }}
    secrets:
      RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
