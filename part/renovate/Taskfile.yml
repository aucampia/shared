# https://taskfile.dev/usage/
# Included from the root Taskfile.yml as the "renovate" namespace - see
# ../../Taskfile.yml. Runs from the repo root (no `dir:` override), so
# RENOVATE_WORKSPACE defaults to "." meaning *this* repository, and every
# path into this part's own files goes through {{.TASKFILE_DIR}} (this
# file's directory) rather than a path relative to the caller's cwd.
version: "3"
env:
  RENOVATE_CACHE_ARCHIVE: '{{.RENOVATE_CACHE_ARCHIVE | default "/tmp/renovate-cache.tar.gz"}}'
  RENOVATE_REPORT_FILE: '{{.RENOVATE_REPORT_FILE | default "/tmp/renovate-report.json"}}'
tasks:
  default:
    desc: Run Renovate against a workspace
    summary: |
      Run Renovate against RENOVATE_WORKSPACE (default: this repository, so
      "shared" dogfoods its own action). Point it at another checkout to
      renovate that repository instead, e.g.:

        RENOVATE_WORKSPACE=~/code/aucampia/signalsmith task renovate

      This is the exact code path CI runs, via part/renovate/v1/action/run.sh.
    env:
      RENOVATE_WORKSPACE: '{{.RENOVATE_WORKSPACE | default "."}}'
    cmds:
      - "{{.TASKFILE_DIR}}/v1/action/run.sh"
  dry-run:
    desc: Dry-run Renovate against a workspace using your own gh token
    cmds:
      - |
        RENOVATE_TOKEN="$(gh auth token)" RENOVATE_DRY_RUN=full RENOVATE_LOG_LEVEL=debug \
        task renovate 2>&1 |
        tee renovate-output.log
  config:validate:
    desc: Validate the default Renovate configs
    summary: |
      Validate the self-hosted global config with renovate-config-validator
      --strict, out of the same image the renovate service uses. Its
      `globalExtends: ["github>aucampia/shared//part/renovate/v1/default.json"]`
      makes this also resolve and validate default.json (the repo-config
      preset) as it is published on GitHub right now - not the working
      tree's copy, so a local edit to default.json only shows up here after
      it is pushed.
    cmds:
      - |
        set -euo pipefail
        RENOVATE_TOKEN="" RENOVATE_GITHUB_ACTIONS_TOKEN="" RENOVATE_REPOSITORIES="" \
          docker compose -f {{.TASKFILE_DIR}}/v1/action/docker-compose.yaml --project-name renovate-gh-aucampia-shared \
          run --entrypoint="" --quiet-build --quiet-pull -T --rm renovate \
          renovate-config-validator --strict /srv/action/renovate-global.json5
    vars:
      RENOVATE_WORKSPACE:
        sh: pwd
    env:
      RENOVATE_WORKSPACE: "{{.RENOVATE_WORKSPACE}}"
  gha:run:
    desc: Run the renovate workflow against the current branch, for a given repo
    summary: |
      Dispatch REPO's .github/workflows/renovate.yml against the current
      branch of *this* (shared) repository, so an action/workflow change can
      be exercised for real before it is merged.

      Defaults to a full dry run against "shared" itself - no branches, PRs
      or comments. Override REPO=aucampia/<other-repo> to test against a
      consumer, and RENOVATE_GHA_DRY_RUN=disabled for a real run.

      The consumer's workflow checks out `shared` at inputs.shared-ref (see
      part/renovate/v1/templates/renovate.yml), so this only exercises a
      branch of `shared` if the consumer's own renovate.yml passes that
      input through.
    env:
      REPO: '{{.REPO | default "aucampia/shared"}}'
      REF:
        sh: git branch --show-current
    vars:
      GHA_DRY_RUN: '{{.RENOVATE_GHA_DRY_RUN | default "full"}}'
      GHA_LOG_LEVEL: '{{.RENOVATE_GHA_LOG_LEVEL | default "debug"}}'
      REPORT_DIR: '{{.RENOVATE_REPORT_DIR | default "/tmp/renovate-gha-report"}}'
    cmds:
      - |
        set -euo pipefail

        declare -p REF REPO >&2

        # `gh workflow run` does not report the run it created, so remember the
        # newest run on this branch and wait for a different one to show up.
        LAST_RUN_ID="$(gh run list --repo "${REPO}" --workflow renovate.yml --branch "${REF}" --limit 1 --json databaseId --jq '.[0].databaseId // ""')"

        gh workflow run renovate.yml --repo "${REPO}" --ref "${REF}" \
          --field "dryRun={{.GHA_DRY_RUN}}" \
          --field "logLevel={{.GHA_LOG_LEVEL}}" \
          --field autoApprove=false

        RUN_ID="${LAST_RUN_ID}"
        while [ "${RUN_ID}" == "${LAST_RUN_ID}" ]; do
          sleep 4
          echo "Waiting for the renovate run on ${REF} to start..." >&2
          RUN_ID="$(gh run list --repo "${REPO}" --workflow renovate.yml --branch "${REF}" --limit 1 --json databaseId --jq '.[0].databaseId // ""')"
        done
        declare -p RUN_ID >&2

        WATCH_STATUS=0
        gh run watch --repo "${REPO}" --exit-status "${RUN_ID}" || WATCH_STATUS="${?}"

        mkdir -p {{.REPORT_DIR | q}}
        if gh run download --repo "${REPO}" "${RUN_ID}" -n renovate-report --dir {{.REPORT_DIR | q}}; then
          echo "Renovate report downloaded to {{.REPORT_DIR}}" >&2
        else
          echo "No renovate-report artifact on run ${RUN_ID}" >&2
        fi

        exit "${WATCH_STATUS}"
  env:run:
    desc: Extract Renovate secrets for a local run, for a given repo
    env:
      REPO: '{{.REPO | default "aucampia/shared"}}'
      TMP_DIR:
        sh: |
          set -euo pipefail;
          mktemp -d -t renovate-env-XXXXXXXXXX
    cmds:
      - defer: |
          if [ -e "${TMP_DIR}/run_id" ]; then
            RUN_ID="$(cat "${TMP_DIR}/run_id")"
            echo "Canceling Renovate run ${RUN_ID}..." >&2
            gh run cancel --repo "${REPO}" "${RUN_ID}" || true
          fi

          echo "Removing all the temp files";
          rm -vfr "${TMP_DIR}"
      - |
        set -euo pipefail

        gh workflow run renovate-env.yml --repo "${REPO}" --field lifetime=600 --field "gpg_public_key=$(gpg --armor --export)" --ref main
        RUN_ID=""
        while [ -z "${RUN_ID}" ]; do
          sleep 4
          echo "Waiting for Renovate run to start..."
          RUN_ID="$(gh run list --repo "${REPO}" --workflow renovate-env.yml --branch main --status=in_progress --json 'number,databaseId' --jq '[sort_by(.number) | reverse][0][0].databaseId')"
        done
        echo "RUN_ID=${RUN_ID@Q}" >&2
        echo "${RUN_ID}" > "${TMP_DIR}/run_id"
      - |
        set -euo pipefail
        gh run download --repo "${REPO}" "${RUN_ID}" -n renovate-env --dir "${TMP_DIR}"
        gpg --decrypt "${TMP_DIR}/renovate-env.asc" > "${TMP_DIR}/renovate-env.sh"
        # shellcheck disable=SC1091
        source "${TMP_DIR}/renovate-env.sh"
        export RENOVATE_TOKEN RENOVATE_GITHUB_ACTIONS_TOKEN
        exec {{.CLI_ARGS}}
  update-token:
    desc: Mint a fine-grained Renovate PAT and store it as a secret
    summary: |
      Prints a pre-filled fine-grained-PAT creation URL, reads the PAT from
      stdin, and stores it as REPO's Actions secret (default: this repo).

      Repository access defaults to "Only select repositories" - REPOS
      (default: REPO's short name) - since GitHub's PAT template URL has no
      query parameter for this step (unlike every other field: see
      https://github.blog/changelog/2025-08-26-template-urls-for-fine-grained-pats-and-updated-permissions-ui/),
      so the printed instructions call it out and it has to be picked by
      hand. Pass SCOPE=all for a token that can reach every repository in
      the account instead - strictly wider than the default, so only ask
      for it when Renovate genuinely needs to touch repositories beyond
      REPOS.

      Pass TARGET=codespaces to store it as your account-wide Codespaces
      secret instead, so `task renovate` picks it up in any Codespace with
      no per-repo setup - only for local runs, not CI: GitHub Actions
      workflows cannot read Codespaces secrets, so a repo's own
      .github/workflows/renovate.yml still needs its own Actions
      RENOVATE_TOKEN secret regardless.

      TARGET=codespaces requires the `codespace` OAuth scope on your `gh`
      token (`gh auth refresh -s codespace` first) - without it the API
      fails with the misleading "Must have admin rights to Repository."

      REPOS (default: REPO's short name) sets which repositories the PAT
      instructions list and, for TARGET=codespaces, which repositories can
      see the secret - `gh secret set --repos` REPLACES that list every
      time it runs, it does not add to it, so pass every repository that
      needs access, comma-separated, on every run:
      REPOS=shared,cookiecutter-python,signalsmith.
    vars:
      TARGET: '{{.TARGET | default "actions"}}'
      SCOPE: '{{.SCOPE | default "repo"}}'
      REPO: '{{.REPO | default "aucampia/shared"}}'
      REPOS: '{{.REPOS | default (.REPO | trimPrefix "aucampia/")}}'
      PAT_URL: "https://github.com/settings/personal-access-tokens/new?name={{print \"Renovate - \" .REPO | urlquery}}&description={{print \"Token used by Renovate for \" .REPO | urlquery}}&target_name=aucampia&expires_in=356&members=read&statuses=write&contents=write&vulnerability_alerts=read&issues=write&pull_requests=write&workflows=write"
    cmds:
      - cmd: |
          cat <<'EOF'
          Generate a PAT with the following permissions and paste it here.
          - Contents: Read and write (Level: Repository or Organization)
          - Issues: Read and write (Level: Repository or Organization)
          - Pull requests: Read and write (Level: Repository or Organization)
          - Commit statuses: Read and write (Level: Repository or Organization)
          - Dependabot alerts: Read-only (Level: Repository or Organization)
          - Members: Read-only (Level: Organization)
          - Workflows: Read and write (Level: Repository or Organization)

          ⚠️ Repository access - the URL below cannot pre-fill this step:
          {{if eq .SCOPE "all"}}select "All repositories". This token will reach every repository in the account, not just {{.REPOS}} - only chosen because SCOPE=all was passed.{{else}}select "Only select repositories" and add exactly: {{.REPOS}} (pass SCOPE=all instead for a token that can reach every repository in the account).{{end}}

          ⚠️ Make sure to delete any old tokens after generating a new token ⚠️

          The following URL should take you to a page with every other
          field pre-filled:
          {{.PAT_URL}}
          EOF
        silent: true
      - |
        echo "Paste your PAT here:"
        read -r RENOVATE_TOKEN
        {{if eq .TARGET "codespaces"}}
        gh secret set RENOVATE_TOKEN --user --app codespaces --repos {{.REPOS | q}} <<< "${RENOVATE_TOKEN}"
        {{else}}
        gh secret set RENOVATE_TOKEN --repo {{.REPO}} <<< "${RENOVATE_TOKEN}"
        {{end}}
