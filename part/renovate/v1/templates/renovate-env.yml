# Copy this file to .github/workflows/renovate-env.yml in a consumer
# repository if you want `task renovate:env:run REPO=<this-repo>` (from an
# aucampia/shared checkout) to work against it - see aucampia/shared's
# README.md "Local runs".
name: renovate-env

on:
  workflow_dispatch:
    inputs:
      lifetime:
        description: 'How long should the tokens be valid for'
        type: number
        default: 120
      gpg_public_key:
        required: true
        description: 'The public key to use for GPG encryption'
        type: string

concurrency:
  group: >
    ${{ github.repository }}-
    ${{ github.workflow }}-
  cancel-in-progress: true

jobs:
  renovate-env:
    uses: aucampia/shared/.github/workflows/renovate-env-v1.yml@main
    permissions:
      pull-requests: write # exported RENOVATE_GITHUB_ACTIONS_TOKEN approves PRs locally
    with:
      lifetime: ${{ inputs.lifetime }}
      gpg_public_key: ${{ inputs.gpg_public_key }}
    secrets:
      RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
