# Optional: paste the "renovate:" task below into a consumer repository's own
# Taskfile.yml (under `tasks:`) for a `task renovate` that works from that
# repository's own checkout, with no separate aucampia/shared clone to
# manage. It shallow-clones aucampia/shared into .cache/shared (add that to
# .gitignore) and delegates to the exact script CI runs.
#
# This is the secondary path - the primary one is running `task renovate`
# from an aucampia/shared checkout with RENOVATE_WORKSPACE pointed at this
# repository. See aucampia/shared's README.md "Local runs".
tasks:
  renovate:
    desc: Run renovate
    vars:
      SHARED_DIR: "{{.SHARED_DIR | default \".cache/shared\"}}"
      SHARED_REF: "{{.SHARED_REF | default \"main\"}}"
    cmds:
      - |
        set -Eeuo pipefail
        if [ -d {{.SHARED_DIR | q}}/.git ]; then
          git -C {{.SHARED_DIR | q}} fetch --depth 1 origin {{.SHARED_REF | q}}
          git -C {{.SHARED_DIR | q}} checkout FETCH_HEAD
        else
          git clone --depth 1 --branch {{.SHARED_REF | q}} https://github.com/aucampia/shared {{.SHARED_DIR | q}}
        fi
      - |
        set -Eeuo pipefail
        RENOVATE_WORKSPACE="$(pwd)" exec {{.SHARED_DIR}}/part/renovate/v1/action/run.sh
